<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#232a33"/><stop offset="1" stop-color="#0e1115"/></linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset="1" stop-color="#e85d0c"/></linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="210" fill="none" stroke="#3a4350" stroke-width="6"/>
  <!-- base -->
  <rect x="230" y="770" width="300" height="56" rx="18" fill="#3a4350"/>
  <!-- coluna (haste do K) -->
  <rect x="300" y="250" width="130" height="540" rx="65" fill="url(#or)"/>
  <!-- braço superior (diagonal para cima) -->
  <g transform="rotate(-42 365 520)"><rect x="365" y="455" width="420" height="120" rx="60" fill="url(#or)"/></g>
  <!-- perna (diagonal para baixo) -->
  <g transform="rotate(42 365 560)"><rect x="365" y="500" width="360" height="120" rx="60" fill="url(#or)"/></g>
  <!-- articulações -->
  <circle cx="365" cy="540" r="62" fill="#2b3037"/><circle cx="365" cy="540" r="30" fill="#ffb066"/>
  <circle cx="365" cy="300" r="40" fill="#2b3037"/>
  <!-- garra no fim do braço superior -->
  <g transform="translate(676 266) rotate(-42)">
    <rect x="0" y="-48" width="60" height="96" rx="12" fill="#2b3037"/>
    <rect x="58" y="-58" width="78" height="26" rx="8" fill="#c9d1d9"/>
    <rect x="58" y="32" width="78" height="26" rx="8" fill="#c9d1d9"/>
  </g>
  <!-- peça -->
  <rect x="728" y="690" width="110" height="110" rx="14" fill="#3f86d6"/>
</svg>
